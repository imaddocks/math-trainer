<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Added viewport-fit=cover for iPhone safe-area support -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Math Trainer</title>
  <meta name="description" content="Dark-mode maths practice app with hints, difficulty levels, and offline support." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27%23262b31%27/%3E%3Ctext x=%2750%27 y=%2758%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27%23f5f5f7%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1:#1b1d22; --bg2:#262b31;
      --text:#f5f5f7; --muted:#aaaaaa;
      --primary:#5fdada; --secondary:#ffd166;
      --ok:#7ae582; --bad:#ff7aa2;
      --card:#20242b; --card2:#2a2f37;
      --ring:2px solid rgba(255,255,255,0.08);
      --radius:16px;
    }

    * { box-sizing:border-box }
    html, body { height:100% }

    body {
      margin:0;
      font-family:Rubik, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:linear-gradient(135deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      /* Safe area padding for notches and home bar */
      padding-top:calc(env(safe-area-inset-top, 0px) + 16px);
      padding-right:16px;
      padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
      padding-left:16px;
    }

    .app {
      width:100%; max-width:560px;
      background:linear-gradient(180deg, var(--card), var(--card2));
      border-radius:24px; padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
      border:var(--ring);
    }

    header {
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:12px;
    }

    .title { font-weight:800; letter-spacing:.2px }

    .pill {
      display:inline-flex; gap:8px; align-items:center;
      padding:10px 14px; border-radius:999px;
      background:#2f3540; border:var(--ring); color:var(--text);
      font-size:14px;
    }

    .row { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 16px }

    select {
      appearance:none; border:none; outline:none;
      background:transparent; color:var(--text);
      font:inherit; padding-right:20px; cursor:pointer;
    }

    .question {
      background:#232833; border:var(--ring); border-radius:var(--radius);
      padding:18px; font-size:26px; text-align:center; font-weight:600;
    }

    .answer {
      margin-top:10px; display:flex; gap:10px;
      align-items:center; justify-content:center;
    }

    input[type="text"] {
      width:100%; max-width:280px; text-align:center;
      padding:14px 16px; border-radius:999px; border:var(--ring);
      background:#1f242d; color:var(--text); font-size:20px;
      outline:none;
    }

    .pad {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px; margin-top:14px;
    }

    button {
      border:none; cursor:pointer; font:inherit; color:var(--text);
      background:#2b313c; padding:14px 16px; border-radius:16px;
      border:var(--ring);
      transition:transform .05s ease, background .15s ease;
    }

    button:active { transform:scale(0.98) }

    .btn-primary {
      background:linear-gradient(180deg,#3ecaca,#41a3a3);
      color:#082a2a; font-weight:700;
    }

    .btn-secondary {
      background:linear-gradient(180deg,#ffe08f,#ffcf5b);
      color:#3a2a00; font-weight:700;
    }

    .feedback { min-height:28px; text-align:center; margin-top:8px; font-weight:600 }
    .feedback.ok { color:var(--ok) }
    .feedback.bad { color:var(--bad) }

    .hint { margin-top:6px; text-align:center; color:var(--muted); font-size:14px }
    footer { margin-top:14px; text-align:center; color:var(--muted); font-size:13px }
    .tiny { font-size:12px; opacity:.8 }

    .chip {
      display:inline-flex; gap:6px; align-items:center;
      padding:6px 10px; border-radius:999px;
      background:#2b313c; border:var(--ring); font-size:12px;
    }

    @media (min-width:420px) {
      .pad { gap:12px }
      button { padding:16px 18px; border-radius:18px }
    }
  </style>
</head>
<body>
  <main class="app" role="main">
    <header>
      <div class="title">Math Trainer 💡</div>
      <div class="chip" id="streak">🔥 Streak: 0</div>
    </header>

    <section class="row">
      <div class="pill">
        <span>Type</span>
        <select id="type">
          <option value="mixed">Mixed</option>
          <option value="add">Addition</option>
          <option value="sub">Subtraction</option>
          <option value="mul">Multiplication</option>
          <option value="div">Division</option>
          <option value="pct">Percentages</option>
        </select>
      </div>
      <div class="pill">
        <span>Difficulty</span>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <button id="newBtn" class="pill">New ↻</button>
    </section>

    <section class="question" id="question">Press “New ↻” to start</section>

    <div class="answer">
      <input id="answer" type="text" inputmode="none" readonly
        autocomplete="off" placeholder="Tap numbers…" aria-label="Your answer" />
    </div>

    <!-- keypad reordered 1–9 -->
    <section class="pad">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="0">0</button>
      <button data-key=".">.</button>
      <button id="backBtn" class="btn-secondary">⌫</button>
    </section>

    <div class="actions" style="display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;">
      <button id="clearBtn" class="btn-secondary">Clear</button>
      <button id="hintBtn" class="pill">💡 Show Hint</button>
      <button id="submitBtn" class="btn-primary">✔️ Submit</button>
    </div>

    <div id="feedback" class="feedback"></div>
    <div id="hint" class="hint"></div>

    <footer>
      Practice makes progress ✨
      <div class="tiny">Offline ready. Add to Home Screen for quick access.</div>
    </footer>
  </main>

  <script>
    const els={
      type:document.getElementById('type'),
      difficulty:document.getElementById('difficulty'),
      newBtn:document.getElementById('newBtn'),
      q:document.getElementById('question'),
      input:document.getElementById('answer'),
      pad:document.querySelector('.pad'),
      back:document.getElementById('backBtn'),
      clear:document.getElementById('clearBtn'),
      submit:document.getElementById('submitBtn'),
      feedback:document.getElementById('feedback'),
      hint:document.getElementById('hint'),
      hintBtn:document.getElementById('hintBtn'),
      streak:document.getElementById('streak')
    };

    let current=null, wrongOnce=false;
    let streak=Number(localStorage.getItem('mt_streak')||0);
    updateStreak(0);

    const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    function ranges(l){return l==='easy'?{min:1,max:10}:l==='medium'?{min:10,max:50}:{min:50,max:100};}
    const approxEqual=(a,b)=>Math.abs(a-b)<0.00001;
    const parseAns=v=>v.trim()===''?null:(isFinite(+v)?+v:null);
    const clampLen=(s,m=14)=>s.length>m?s.slice(0,m):s;

    function hintFor(q){
      const {op,a,b,extra}=q;
      switch(op){
        case'add':return`Add the tens first, then the ones.`;
        case'sub':return`Count up from ${Math.min(a,b)} to ${Math.max(a,b)}.`;
        case'mul':return`Break it down: ${a}×${b} = ${a}×10 − ${a} if b=9.`;
        case'div':return`Think “what times ${b} gives ${a}?”`;
        case'pct':return`${extra.p}% = ${(extra.p/100)} of the number.`;
      }return'';
    }

    function newAdd(l){const{min,max}=ranges(l);const a=rand(min,max),b=rand(min,max);return{op:'add',a,b,text:`What is ${a}+${b}?`,answer:a+b}}
    function newSub(l){const{min,max}=ranges(l);let a=rand(min,max),b=rand(min,max);if(a<b)[a,b]=[b,a];return{op:'sub',a,b,text:`What is ${a}−${b}?`,answer:a-b}}
    function newMul(l){const{min,max}=ranges(l);const a=rand(min,l==='easy'?10:max),b=rand(min,l==='easy'?10:max);return{op:'mul',a,b,text:`What is ${a}×${b}?`,answer:a*b}}
    function newDiv(l){const{min,max}=ranges(l);const b=rand(Math.max(2,min),Math.max(2,Math.min(12,max)));const c=rand(min,max);const a=b*c;return{op:'div',a,b,text:`What is ${a}÷${b}?`,answer:c}}
    function newPct(l){const sets={easy:{perc:[5,10,20,25,50],base:[10,20,50,100]},medium:{perc:[5,10,15,20,25,30,40,50],base:[60,80,100,120,150,200,250,300]},hard:{perc:[7.5,12.5,17.5,22.5,35,45,55],base:[75,95,125,175,275,450,600]}};const s=sets[l]||sets.medium;const p=s.perc[rand(0,s.perc.length-1)];const base=s.base[rand(0,s.base.length-1)];const ans=Math.round((p/100*base)*100)/100;return{op:'pct',a:base,extra:{p},text:`What is ${p}% of ${base}?`,answer:ans}}

    function nextQuestion(){
      wrongOnce=false;
      els.feedback.textContent=''; els.feedback.className='feedback';
      els.hint.textContent=''; els.input.value='';
      const t=els.type.value,d=els.difficulty.value;
      const ops={add:newAdd,sub:newSub,mul:newMul,div:newDiv,pct:newPct};
      current=t==='mixed'?[newAdd,newSub,newMul,newDiv,newPct][rand(0,4)](d):ops[t](d);
      els.q.textContent=current.text;
    }

    function updateStreak(d){streak=Math.max(0,streak+d);localStorage.setItem('mt_streak',streak);els.streak.textContent=`🔥 Streak: ${streak}`;}

    function submit(){
      if(!current)return;
      const val=parseAns(clampLen(els.input.value.trim()));
      if(val===null)return flash('Please enter an answer','bad');
      if(approxEqual(val,current.answer)){
        els.feedback.textContent='✅ Correct!'; els.feedback.className='feedback ok';
        updateStreak(1); setTimeout(nextQuestion,1200);
      } else {
        els.feedback.textContent='❌ Not quite.'; els.feedback.className='feedback bad';
        updateStreak(-streak);
        if(!wrongOnce){wrongOnce=true;pulse(els.hintBtn);} else els.hint.textContent=hintFor(current);
      }
    }

    function flash(msg,k='bad'){els.feedback.textContent=msg;els.feedback.className=`feedback ${k==='ok'?'ok':'bad'}`;setTimeout(()=>{els.feedback.textContent='';els.feedback.className='feedback';},1200);}
    function pulse(el){el.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:600,easing:'ease'});}

    els.newBtn.onclick=nextQuestion;
    els.submit.onclick=submit;
    els.clear.onclick=()=>els.input.value='';
    els.back.onclick=()=>els.input.value=els.input.value.slice(0,-1);
    els.hintBtn.onclick=()=>current&&(els.hint.textContent=hintFor(current));
    els.pad.onclick=e=>{const k=e.target.getAttribute('data-key');if(!k)return;if(k==='.'&&els.input.value.includes('.'))return;els.input.value+=k;};

    // Enable typing on desktop only
    if(window.innerWidth>768){
      els.input.removeAttribute('readonly');
      els.input.setAttribute('inputmode','decimal');
      window.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
    }

    nextQuestion();

    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
